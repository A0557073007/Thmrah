<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السلة | ثمرة رزق</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><a class="back" href="index.html">→ متابعة التسوق</a><div class="pagehead"><div class="brandname">ثمرة <i>رزق</i></div><h1>سلة الطلب 🛒</h1><p>راجع الكميات ثم أدخل بيانات التوصيل.</p></div><div class="cartwrap"><div id="rows"></div><div class="totalbox"><span>الإجمالي</span><span id="total">0 ر.س</span></div><input class="field" id="customerName" placeholder="اسم العميل"><input class="field" id="address" placeholder="العنوان / الحي / الشارع"><input class="field" id="note" placeholder="ملاحظات الطلب (اختياري)"><a class="send" id="send" href="#">إرسال الطلب عبر واتساب</a></div><nav class="nav"><a href="index.html"><span>🏠</span>الرئيسية</a><a href="grocery.html"><span>🛍️</span>الأقسام</a><a href="cart.html"><span>🛒<i class="cartCount">0</i></span>السلة</a><a href="https://wa.me/966544444268"><span>💬</span>تواصل</a></nav></main><script src="app.js"></script><script>
function renderCart(){let c=cart(),html="",sum=0;Object.entries(c).forEach(([id,q])=>{let p=PRODUCTS.find(x=>x.id===id);if(!p)return;sum+=p.price*q;html+=`<div class="cartitem"><div class="cartemoji">${p.emoji}</div><div><b>${p.name}</b><div class="unit">${p.price} ر.س / ${p.unit}</div><div class="qty"><button onclick="chg('${id}',1)">+</button><span>${q}</span><button onclick="chg('${id}',-1)">−</button></div></div><b>${p.price*q} ر.س</b></div>`});rows.innerHTML=html||'<div class="empty">السلة فارغة 🛒</div>';total.textContent=sum+" ر.س";badge()}
function chg(id,d){let c=cart();c[id]=(c[id]||0)+d;if(c[id]<=0)delete c[id];save(c);renderCart()}
send.onclick=function(e){e.preventDefault();let c=cart(),lines=[],sum=0;Object.entries(c).forEach(([id,q])=>{let p=PRODUCTS.find(x=>x.id===id);if(p){lines.push(`${p.name} × ${q} = ${p.price*q} ر.س`);sum+=p.price*q}});if(!lines.length){alert("السلة فارغة");return}let order="TR-"+Date.now().toString().slice(-6);let msg=`طلب جديد - ثمرة رزق
رقم الطلب: ${order}

${lines.join("\n")}

الإجمالي: ${sum} ر.س
الاسم: ${customerName.value||"-"}
العنوان: ${address.value||"-"}
ملاحظات: ${note.value||"-"}`;location.href="https://wa.me/966544444268?text="+encodeURIComponent(msg)}
renderCart();</script></body></html>
